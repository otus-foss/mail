name: quality

on:
  pull_request:
  push:
    branches: [main]

# Shared Otus libraries resolve from the Forgejo Maven registry.
env:
  ORG_GRADLE_PROJECT_otusMetaRegistry: ${{ vars.OTUS_META_REGISTRY_URL || 'https://git.hilfikers.com/api/packages/florian.ruby/maven' }}
  ORG_GRADLE_PROJECT_otusMetaUsername: ${{ vars.OTUS_META_PACKAGES_USERNAME || 'florian.ruby' }}
  ORG_GRADLE_PROJECT_otusMetaPassword: ${{ secrets.OTUS_META_PACKAGES_TOKEN }}

concurrency:
  group: quality-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: https://github.com/actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: https://github.com/actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install -r requirements-quality.txt
      - run: ./gradlew qualityCheck --console=plain

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: https://github.com/actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: https://github.com/android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: ./gradlew :androidApp:lintDebug :androidApp:assembleDebug :androidApp:testDebugUnitTest :shared:testAndroidHostTest --console=plain

  ios:
    runs-on: otus-macos
    timeout-minutes: 60
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Compose Multiplatform links iOS 26 SDK symbols, so the app needs Xcode 26.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: https://github.com/actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: brew install mint
      - run: mint bootstrap
      - run: mint run swiftformat --lint iosApp
      - run: mint run swiftlint lint --strict
      - name: Compile iOS simulator app
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk
          iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
          build
