included:
  - iosApp/iosApp
  - iosApp/PushSupport
  - iosApp/NotificationService
  - iosApp/PushSupportTests
strict: true
disabled_rules:
  - file_length # Owned by the architecture gate and its scoped exception policy.
opt_in_rules:
  - empty_count
  - empty_string
  - force_unwrapping
  - sorted_imports
  - explicit_init
  - closure_spacing
  - redundant_nil_coalescing
  - contains_over_filter_count
  - first_where
  - last_where
line_length: 120
function_body_length: 40
type_body_length: 150
identifier_name:
  excluded:
    - id
