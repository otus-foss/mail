# Place the map and the zones in the http context. Configure certificate paths for the deployment.
# Limits count per IPv4 address and per IPv6 /64: one host usually holds a whole /64, so limiting
# single IPv6 addresses would let it pick a new address for every request. The key is the first
# 8 of the 16 bytes of an IPv6 address; a 4-byte IPv4 address does not match and stays whole.
map $binary_remote_addr $otus_client {
    "~(?s)^(?<otus_prefix>.{8}).{8}$" $otus_prefix;
    default $binary_remote_addr;
}
limit_req_zone $otus_client zone=otus_registration:10m rate=2r/m;
limit_req_zone $otus_client zone=otus_delivery:10m rate=30r/s;

server {
    listen 443 ssl;
    server_name push.example.org;
    ssl_certificate /etc/letsencrypt/live/push.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.example.org/privkey.pem;
    access_log off;
    client_max_body_size 4096;
    client_body_timeout 10s;

    location = /v1/routes {
        limit_req zone=otus_registration burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        limit_req zone=otus_delivery burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
}
