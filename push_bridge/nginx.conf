# Place the zones in the http context. Configure certificate paths for the deployment.
limit_req_zone $binary_remote_addr zone=otus_registration:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=otus_delivery:10m rate=30r/s;

server {
    listen 443 ssl;
    server_name push.example.org;
    ssl_certificate /etc/letsencrypt/live/push.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/push.example.org/privkey.pem;
    access_log off;
    client_max_body_size 4096;
    client_body_timeout 10s;

    location = /v1/routes {
        limit_req zone=otus_registration burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        limit_req zone=otus_delivery burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
}
