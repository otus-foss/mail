# Versions only Mail uses. Everything else comes from core's gradle/libs.versions.toml, which
# settings.gradle.kts loads as `libs`.
[versions]
androidx-work = "2.11.0"
unifiedpush = "3.3.5"
unifiedpush-fcm = "3.1.0"
sqldelight = "2.4.0"

[libraries]
unifiedpush-fcm = { module = "org.unifiedpush.android:embedded-fcm-distributor", version.ref = "unifiedpush-fcm" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }

[plugins]
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
