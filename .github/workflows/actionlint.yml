name: actionlint

# Lints the workflows in pull requests that change them. Runs when quality does.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.pull_request.draft && (
        github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
        github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci on every push') ||
        github.event.action == 'labeled' && github.event.label.name == 'ci on every push')
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          VERSION: 1.7.7
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
