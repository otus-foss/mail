name: actionlint

# Lints the workflows in pull requests that change them. Runs when quality does.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Decides whether this run checks anything; see core's .github/actions/ready-gate.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/core
          path: core
          fetch-depth: 0
          persist-credentials: false
      # Core's branch with this branch's name when there is one, else main, so every Core action
      # and the build come from the Core that lands with this change.
      - name: Use the Core partner branch
        working-directory: core
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - id: gate
        uses: ./core/.github/actions/ready-gate

  actionlint:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          VERSION: 1.7.7
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
