name: actionlint

# Lints the workflows in pull requests that change them. Runs once per pull request, like quality.
on:
  pull_request:
    types: [opened, ready_for_review]
    paths: [".github/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run actionlint
        env:
          VERSION: 1.7.7
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v$VERSION/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
