name: pull request

# Advisory facts about a pull request: a size label, a comment with the screenshots it adds or
# changes, and a warning when UI code changes without new screenshots. Nothing here fails a pull
# request. Runs when quality does.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]

permissions:
  contents: read

# Each kind of event gets its own group, so a run that skips everything cannot cancel a real one.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  # Decides whether this run checks anything; see otus-meta's .github/actions/ready-gate.
  gate:
    runs-on: ubicloud-standard-2
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          sparse-checkout: .github/actions
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      - id: gate
        uses: ./otus-meta/.github/actions/ready-gate

  # Counts changed lines outside tests and screenshots, unless the pull request changes only those.
  size:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubicloud-standard-2
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Label the size
        run: |
          gh api --paginate "repos/$GH_REPO/pulls/$PR/files" \
            --jq '.[] | "\(.additions + .deletions) \(.filename)"' > files.txt
          tests='(^|/)src/[A-Za-z]*Test/|(^|/)src/test/|\.png$'
          lines=$(grep -vE "$tests" files.txt | awk '{ n += $1 } END { print n + 0 }')
          if ! grep -qvE "$tests" files.txt; then lines=$(awk '{ n += $1 } END { print n + 0 }' files.txt); fi
          if [ "$lines" -lt 20 ]; then size=XS
          elif [ "$lines" -lt 60 ]; then size=S
          elif [ "$lines" -lt 200 ]; then size=M
          elif [ "$lines" -lt 1000 ]; then size=L
          else size=XL; fi
          echo "$lines changed lines: size:$size"
          gh label create size:XS --force --color 0e8a16 --description "Under 20 changed lines, tests left out"
          gh label create size:S --force --color 5ebd3e --description "20 to 59 changed lines, tests left out"
          gh label create size:M --force --color fbca04 --description "60 to 199 changed lines, tests left out"
          gh label create size:L --force --color fe7d37 --description "200 to 999 changed lines, tests left out"
          gh label create size:XL --force --color d93f0b --description "1000 or more changed lines, tests left out"
          stale=$(gh pr view "$PR" --json labels \
            --jq "[.labels[].name | select(startswith(\"size:\") and . != \"size:$size\")] | join(\",\")")
          if [ -n "$stale" ]; then gh pr edit "$PR" --remove-label "$stale"; fi
          gh pr edit "$PR" --add-label "size:$size"

  # Shows each screenshot the pull request adds or changes, old beside new, from the commits
  # themselves, so the images stay put after a merge.
  screenshots:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubicloud-standard-2
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Comment the changed screenshots
        run: |
          gh api --paginate "repos/$GH_REPO/pulls/$PR/files" \
            --jq '.[] | "\(.status) \(.filename) \(.previous_filename // .filename)"' > files.txt
          shots=$(grep -E '^[a-z]+ [^ ]*screenshots/[^ ]*\.png ' files.txt || true)
          marker="<!-- otus-screenshots -->"
          comment=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -z "$shots" ]; then
            if grep -qE '^[a-z]+ [^ ]*src/commonMain/[^ ]*(presentation|designsystem)/[^ ]*\.kt ' files.txt; then
              echo "::warning title=No screenshots::This pull request changes UI code but no screenshot. Add or re-record a screenshot test for the changed screen."
            fi
            if [ -n "$comment" ]; then gh api -X DELETE "repos/$GH_REPO/issues/comments/$comment"; fi
            exit 0
          fi
          url="https://github.com/$GH_REPO/blob"
          {
            echo "$marker"
            echo "### Screenshots"
            echo
            echo "| Screen | Before | After |"
            echo "| --- | --- | --- |"
            echo "$shots" | head -40 | while read -r status file previous; do
              name=$(basename "$file" .png)
              case "$status" in
                added) echo "| $name, new | | ![]($url/$HEAD/$file?raw=true) |" ;;
                removed) echo "| $name, removed | ![]($url/$BASE/$file?raw=true) | |" ;;
                *) echo "| $name | ![]($url/$BASE/$previous?raw=true) | ![]($url/$HEAD/$file?raw=true) |" ;;
              esac
            done
            total=$(echo "$shots" | wc -l)
            if [ "$total" -gt 40 ]; then echo; echo "And $((total - 40)) more in the Files tab."; fi
          } > body.md
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$comment" -F body=@body.md > /dev/null
          else
            gh pr comment "$PR" --body-file body.md
          fi

  # Quality builds against the Meta branch with this branch's name when there is one, so the pair has
  # to land together, Meta first. The label says so before anyone merges this alone.
  meta-partner:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubicloud-standard-2
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          fetch-depth: 0
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      - id: meta
        uses: ./otus-meta/.github/actions/meta-partner
        with:
          branch: ${{ github.head_ref }}
      - name: Label the pull request
        env:
          PARTNER: ${{ steps.meta.outputs.partner }}
        run: |
          gh label create "needs meta" --force --color 5319e7 \
            --description "Builds against a Meta branch of the same name; merge that first"
          if [ "$PARTNER" = true ]; then
            echo "::notice title=Needs Meta::Merge reazndev/otus-meta branch $BRANCH first."
            gh pr edit "$PR" --add-label "needs meta"
          else
            gh pr edit "$PR" --remove-label "needs meta" 2>/dev/null || true
          fi
