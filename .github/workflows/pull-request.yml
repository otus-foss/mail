name: pull request

# Advisory facts about a pull request: a size label, a comment with the screenshots it adds or
# changes, and a warning when UI code changes without new screenshots. Nothing here fails a pull
# request. Runs when quality does.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]

permissions:
  contents: read

# Each kind of event gets its own group, so a run that skips everything cannot cancel a real one.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  # Decides whether this run checks anything; see otus-core's .github/actions/ready-gate.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/otus-core
          path: otus-core
          fetch-depth: 0
          persist-credentials: false
      # Core's branch with this branch's name when there is one, else main, so every Core action
      # and the build come from the Core that lands with this change.
      - name: Use the Core partner branch
        working-directory: otus-core
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - id: gate
        uses: ./otus-core/.github/actions/ready-gate

  # The size label and the screenshot comment; see otus-core's .github/actions/size-label and
  # screenshot-comment.
  facts:
    # A fork's pull request gets a read-only token, so it skips this job, which writes to the pull request.
    needs: gate
    if: needs.gate.outputs.ready == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/otus-core
          path: otus-core
          fetch-depth: 0
          persist-credentials: false
      # Core's branch with this branch's name when there is one, else main, so every Core action
      # and the build come from the Core that lands with this change.
      - name: Use the Core partner branch
        working-directory: otus-core
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - uses: ./otus-core/.github/actions/size-label
      - uses: ./otus-core/.github/actions/screenshot-comment

  # Quality builds against the Core branch with this branch's name when there is one, so the pair has
  # to land together, Core first. The label says so before anyone merges this alone.
  core-partner:
    # A fork's pull request gets a read-only token, so it skips this job, which writes to the pull request.
    needs: gate
    if: needs.gate.outputs.ready == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/otus-core
          path: otus-core
          fetch-depth: 0
          persist-credentials: false
      - name: Label the pull request
        run: |
          gh label create "needs core" --force --color 5319e7 \
            --description "Builds against a Core branch of the same name; merge that first"
          if git -C otus-core rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            echo "::notice title=Needs Core::Merge $GITHUB_REPOSITORY_OWNER/otus-core branch $BRANCH first."
            gh pr edit "$PR" --add-label "needs core"
          else
            gh pr edit "$PR" --remove-label "needs core" 2>/dev/null || true
          fi
