name: pull request

# Advisory facts about a pull request: a size label, a comment with the screenshots it adds or
# changes, and a warning when UI code changes without new screenshots. Nothing here fails a pull
# request. Runs when quality does.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]

permissions:
  contents: read

# Each kind of event gets its own group, so a run that skips everything cannot cancel a real one.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}-${{ github.event.action }}
  cancel-in-progress: true

jobs:
  # Decides whether this run checks anything; see otus-meta's .github/actions/ready-gate.
  gate:
    runs-on: ubicloud-standard-2
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          fetch-depth: 0
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      # Meta's branch with this branch's name when there is one, else main, so every Meta action
      # and the build come from the Meta that lands with this change.
      - name: Use the Meta partner branch
        working-directory: otus-meta
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - id: gate
        uses: ./otus-meta/.github/actions/ready-gate

  # The size label and the screenshot comment; see otus-meta's .github/actions/size-label and
  # screenshot-comment.
  facts:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          fetch-depth: 0
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      # Meta's branch with this branch's name when there is one, else main, so every Meta action
      # and the build come from the Meta that lands with this change.
      - name: Use the Meta partner branch
        working-directory: otus-meta
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - uses: ./otus-meta/.github/actions/size-label
      - uses: ./otus-meta/.github/actions/screenshot-comment

  # Quality builds against the Meta branch with this branch's name when there is one, so the pair has
  # to land together, Meta first. The label says so before anyone merges this alone.
  meta-partner:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubicloud-standard-2
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          fetch-depth: 0
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      - name: Label the pull request
        run: |
          gh label create "needs meta" --force --color 5319e7 \
            --description "Builds against a Meta branch of the same name; merge that first"
          if git -C otus-meta rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            echo "::notice title=Needs Meta::Merge reazndev/otus-meta branch $BRANCH first."
            gh pr edit "$PR" --add-label "needs meta"
          else
            gh pr edit "$PR" --remove-label "needs meta" 2>/dev/null || true
          fi
