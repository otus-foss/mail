name: quality

# Runs once a pull request is ready: when it opens as ready, or when a draft is marked ready. Later
# pushes start it again only while the pull request has the "ci on every push" label, and adding that
# label starts it at once. Draft pull requests never run it. Every push to main, which includes each
# merged pull request, runs it again so main itself stays checked.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# Each kind of event gets its own group. Most events start a run that skips every job, such as an
# unlabeled push, and that run must not cancel a real one started by another kind of event. Runs on
# main never cancel each other, so every merge gets its own result.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Decides which jobs this change needs; see otus-meta's .github/actions/quality-changes.
  # A run the ready gate stops sets no outputs, so every later job skips.
  changes:
    runs-on: ubicloud-standard-2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
      ios: ${{ steps.files.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          sparse-checkout: .github/actions
          fetch-depth: 0
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      # Meta's branch with this branch's name when there is one, else main, so every Meta action
      # and the build come from the Meta that lands with this change.
      - name: Use the Meta partner branch
        working-directory: otus-meta
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - id: gate
        uses: ./otus-meta/.github/actions/ready-gate
      - id: files
        if: steps.gate.outputs.ready == 'true'
        uses: ./otus-meta/.github/actions/quality-changes

  # Each job runs one part of checkAll, so the parts run at the same time. The tests run in two
  # shards; each test class runs in exactly one of them.
  check:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    name: check (${{ matrix.part }})
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: tooling
            tasks: checkTooling
          - part: android build
            tasks: checkAndroidBuild
          - part: tests 1 of 2
            tasks: checkTests -Potus.testShard=1/2
          - part: tests 2 of 2
            tasks: checkTests -Potus.testShard=2/2
          # Not part of checkAll: builds the release APK so the apk-size job can compare it.
          - part: apk size
            tasks: :androidApp:assembleNightly
    # Mail and otus-meta sit side by side, as on a development machine, so Gradle finds Meta at
    # ../otus-meta and Spotless never sees Meta's files.
    defaults:
      run:
        working-directory: otus-mail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otus-mail
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          fetch-depth: 0
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      # Meta's branch with this branch's name when there is one, else main, so every Meta action
      # and the build come from the Meta that lands with this change.
      - name: Use the Meta partner branch
        working-directory: otus-meta
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - uses: ./otus-meta/.github/actions/setup-build
        with:
          directory: otus-mail
      - run: ./gradlew ${{ matrix.tasks }} --console=plain
      - name: Record the APK size
        if: matrix.part == 'apk size'
        run: |
          set -- androidApp/build/outputs/apk/nightly/*.apk
          stat -c %s "$1" > apk-size.txt
      - if: matrix.part == 'apk size'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk-size
          path: otus-mail/apk-size.txt

  # Comments the release APK's size next to the latest nightly's. Only this job can write to the
  # pull request, so no build step gets that token.
  apk-size:
    needs: check
    if: always() && github.event_name == 'pull_request' && needs.check.result != 'skipped'
    runs-on: ubicloud-standard-2
    permissions:
      pull-requests: write
    steps:
      # The apk size part may have failed, and then there is nothing to compare.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: apk-size
      - name: Comment the size
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f apk-size.txt ]; then exit 0; fi
          size=$(cat apk-size.txt)
          nightly=$(gh release view -R reazndev/otus-mail-nightly --json assets \
            --jq '.assets[] | select(.name | endswith(".apk")) | .size')
          marker="<!-- otus-apk-size -->"
          {
            echo "$marker"
            awk -v s="$size" -v n="$nightly" 'BEGIN {
              printf "Release APK: %.2f MB, %+.1f kB against the latest nightly (%.2f MB).\n",
                s / 1e6, (s - n) / 1e3, n / 1e6 }'
          } > comment.md
          tail -n 1 comment.md >> "$GITHUB_STEP_SUMMARY"
          # One comment per pull request, updated by later runs.
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file comment.md
          fi

  # Runs only while the repository variable IOS_CI is "on" (Settings > Secrets and variables >
  # Actions > Variables), so macOS minutes stay off until someone turns it back on.
  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && vars.IOS_CI == 'on'
    # Ubicloud has no macOS runners, so this job runs on GitHub's.
    runs-on: macos-15
    defaults:
      run:
        working-directory: otus-mail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: otus-mail
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          fetch-depth: 0
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      # Meta's branch with this branch's name when there is one, else main, so every Meta action
      # and the build come from the Meta that lands with this change.
      - name: Use the Meta partner branch
        working-directory: otus-meta
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      # Compose Multiplatform links iOS 26 SDK symbols, so the app needs Xcode 26.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: ./otus-meta/.github/actions/setup-build
        with:
          directory: otus-mail
          android: "false"
          python: "false"
      - run: brew install mint
      - run: mint bootstrap
      - run: mint run swiftformat --lint iosApp
      - run: mint run swiftlint lint --strict
      # Xcode's Kotlin build phase downloads Gradle with a 10 second timeout, so fetch it first.
      - run: ./gradlew --version
      - name: Compile iOS simulator app
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk
          iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
          build
