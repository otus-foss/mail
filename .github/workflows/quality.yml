name: quality

# Runs once per pull request, when it is ready to merge: on opening a pull request that is not a
# draft, or on marking a draft ready for review. Later pushes do not start it again, so open a
# draft and mark it ready once every commit is pushed. Start it by hand to check again.
on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Each job runs one part of checkAll, so the parts run at the same time. The tests run in two
  # shards; each test class runs in exactly one of them.
  check:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    name: check (${{ matrix.part }})
    runs-on: ubicloud-standard-2
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: tooling
            tasks: checkTooling
          - part: android build
            tasks: checkAndroidBuild
          - part: tests 1 of 2
            tasks: checkTests -Potus.testShard=1/2
          - part: tests 2 of 2
            tasks: checkTests -Potus.testShard=2/2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Meta publishing is paused, so build against Meta's source, as the nightly does.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          fetch-depth: 0
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      # Spotless formats every file in the workspace, so Meta moves out of it.
      - name: Use the Meta branch with this branch's name, if there is one
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          mv otus-meta "$RUNNER_TEMP/otus-meta"
          cd "$RUNNER_TEMP/otus-meta"
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - run: python3 -m pip install -r requirements-quality.txt
      - run: ./gradlew ${{ matrix.tasks }} --console=plain -Potus.meta.path="$RUNNER_TEMP/otus-meta"

  ios:
    # macOS checks are paused; delete this condition to run them again.
    if: false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Compose Multiplatform links iOS 26 SDK symbols, so the app needs Xcode 26.
      - run: sudo xcode-select -s /Applications/Xcode_26.3.app && xcodebuild -version
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: brew install mint
      - run: mint bootstrap
      - run: mint run swiftformat --lint iosApp
      - run: mint run swiftlint lint --strict
      - name: Compile iOS simulator app
        # Only this step downloads the shared Otus libraries from otus-meta's GitHub Packages
        # registry; the other jobs build Meta from source, so no other step sees the token.
        env:
          ORG_GRADLE_PROJECT_otusMetaUsername: ${{ github.repository_owner }}
          ORG_GRADLE_PROJECT_otusMetaPassword: ${{ secrets.OTUS_META_PACKAGES_TOKEN }}
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug -sdk
          iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO
          build
