name: coverage

# Measures test coverage with Kover and reports it; the numbers never fail the run. It runs when the
# quality workflow does: once a pull request is ready, on later pushes only while the pull request has
# the "ci on every push" label, on every push to main, and by hand. Draft pull requests never run it.
# A run by hand with a pull request number reports on that pull request without running quality.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to report on and comment; empty for the selected branch
        required: false
        type: string

permissions:
  contents: read

# Each kind of event gets its own group, so a run that skips every job, such as an unlabeled push,
# does not cancel a real one. Runs on main never cancel each other.
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}-${{ inputs.pr }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Decides whether this run checks anything; see otus-core's .github/actions/ready-gate.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/otus-core
          path: otus-core
          fetch-depth: 0
          persist-credentials: false
      # Core's branch with this branch's name when there is one, else main, so every Core action
      # and the build come from the Core that lands with this change.
      - name: Use the Core partner branch
        working-directory: otus-core
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - id: gate
        uses: ./otus-core/.github/actions/ready-gate

  # Runs the JVM tests once with Kover and writes the summary. A pull request's summary also covers
  # the lines it changes, so the checkout keeps the history back to the base.
  report:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.target.outputs.pr }}
    steps:
      # Picks the pull request to report on: the one that started the run, or the one a run by hand
      # names. Either way the checkout is the pull request's merge commit, whose first parent is the
      # base as it is now; the base in the event can be older when the base branch moved since.
      - id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ inputs.pr }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$INPUT_PR" ]; then
            printf 'pr=%s\nbase=%s\nbranch=%s\nref=\n' "$EVENT_PR" "${EVENT_PR:+HEAD^1}" "$BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$INPUT_PR" in
            *[!0-9]*) echo '::error::The pr input must be a pull request number.'; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/pulls/$INPUT_PR" \
            --jq '"branch=\(.head.ref)"' >> "$GITHUB_OUTPUT"
          printf 'pr=%s\nbase=HEAD^1\nref=refs/pull/%s/merge\n' "$INPUT_PR" "$INPUT_PR" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: otus-mail
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/otus-core
          path: otus-core
          fetch-depth: 0
          persist-credentials: false
      # Core's branch with this branch's name when there is one, else main, so every Core action
      # and the build come from the Core that lands with this change.
      - name: Use the Core partner branch
        working-directory: otus-core
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --quiet --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - uses: ./otus-core/.github/actions/setup-build
        with:
          directory: otus-mail
          python: "false"
      # The coverage variant runs Shared's host tests and the app's debug unit tests, screenshot
      # tests included, once each.
      - run: ./gradlew koverXmlReportCoverage koverHtmlReportCoverage --console=plain
        working-directory: otus-mail
      - name: Write the summary
        working-directory: otus-mail
        env:
          BASE: ${{ steps.target.outputs.base }}
        run: |
          set -- build/reports/kover/reportCoverage.xml
          if [ -n "$BASE" ]; then set -- "$@" --base "$BASE"; fi
          python3 ../otus-core/tools/coverage_report.py "$@" > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            otus-mail/build/reports/kover/htmlCoverage
            otus-mail/build/reports/kover/reportCoverage.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: otus-mail/coverage.md

  # Posts the summary as one comment per pull request, updated by later runs. Only this job can
  # write to the pull request, so no build step gets that token.
  comment:
    # A fork's pull request gets a read-only token, so it skips this job, which writes to the pull request.
    needs: report
    if: needs.report.outputs.pr != '' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-summary
      - name: Comment the coverage
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.report.outputs.pr }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- otus-coverage -->"
          {
            echo "$marker"
            cat coverage.md
            echo
            echo "[Full report]($RUN) (HTML and XML in the \`coverage-report\` artifact)"
          } > comment.md
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file comment.md
          fi
