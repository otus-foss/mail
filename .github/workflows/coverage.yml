name: coverage

# Measures test coverage with Kover and reports it; the numbers never fail the run. It runs when the
# quality workflow does: once a pull request is ready, on later pushes only while the pull request has
# the "ci on every push" label, on every push to main, and by hand. Draft pull requests never run it.
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

# Each kind of event gets its own group, so a run that skips every job, such as an unlabeled push,
# does not cancel a real one. Runs on main never cancel each other.
concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}-${{ github.event.action }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Runs the JVM tests once with Kover and writes the summary. A pull request's summary also covers
  # the lines it changes, so the checkout keeps the history back to the base.
  report:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event_name == 'push' ||
      !github.event.pull_request.draft && (
        github.event.action == 'opened' || github.event.action == 'ready_for_review' ||
        github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'ci on every push') ||
        github.event.action == 'labeled' && github.event.label.name == 'ci on every push')
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Meta publishing is paused, so build against Meta's source, as the quality workflow does.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          fetch-depth: 0
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      # Meta moves out of the workspace, so its sources don't count as Mail's.
      - name: Use the Meta branch with this branch's name, if there is one
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          mv otus-meta "$RUNNER_TEMP/otus-meta"
          cd "$RUNNER_TEMP/otus-meta"
          if git rev-parse --verify --quiet "origin/$BRANCH" > /dev/null; then
            git checkout --detach "origin/$BRANCH"
          fi
          git log --oneline -1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      # The coverage variant runs Shared's host tests and the app's debug unit tests, screenshot
      # tests included, once each.
      - run: >-
          ./gradlew koverXmlReportCoverage koverHtmlReportCoverage --console=plain
          -Potus.meta.path="$RUNNER_TEMP/otus-meta"
      - name: Write the summary
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -- build/reports/kover/reportCoverage.xml
          if [ -n "$BASE" ]; then set -- "$@" --base "$BASE"; fi
          python3 tools/coverage_report.py "$@" > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: |
            build/reports/kover/htmlCoverage
            build/reports/kover/reportCoverage.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: coverage.md

  # Posts the summary as one comment per pull request, updated by later runs. Only this job can
  # write to the pull request, so no build step gets that token.
  comment:
    needs: report
    if: github.event_name == 'pull_request'
    runs-on: ubicloud-standard-2
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-summary
      - name: Comment the coverage
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- otus-coverage -->"
          {
            echo "$marker"
            cat coverage.md
            echo
            echo "[Full report]($RUN) (HTML and XML in the \`coverage-report\` artifact)"
          } > comment.md
          comment=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$comment" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file comment.md
          fi
