name: land

# Merges approved pull requests and their partners in the other Otus repositories. The work happens
# in otus-meta's lander workflow; see its docs/landing.md. GitHub runs these triggers from main.
on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize]
  workflow_run:
    workflows: ["quality", "pull request", "actionlint", "coverage", "issue link"]
    types: [completed]

permissions: {}

jobs:
  lander:
    uses: reazndev/otus-meta/.github/workflows/lander.yml@main
    secrets:
      app-private-key: ${{ secrets.LANDER_APP_PRIVATE_KEY }}
