name: nightly

# Builds a signed nightly APK of main and publishes it as a release of the public nightly
# repository, where the app's update check finds it. Changes to either selected revision trigger a build.
# Both source revisions are resolved together and recorded in the release provenance.
# See docs/nightly.md for the secrets this needs.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The release token goes only to the steps that call gh, never to the Gradle build, which runs
# otus-meta's build scripts and every plugin. The build reads Meta from its checkout, so it needs
# no packages token.
env:
  # GitHubNightlyFeed reads releases from this repository.
  NIGHTLY_REPO: reazndev/otus-mail-nightly

concurrency:
  group: nightly

jobs:
  version:
    runs-on: ubicloud-standard-2
    outputs:
      number: ${{ steps.number.outputs.number }}
      previous_mail: ${{ steps.number.outputs.previous_mail }}
      previous_meta: ${{ steps.number.outputs.previous_meta }}
      previous_date: ${{ steps.number.outputs.previous_date }}
      meta_sha: ${{ steps.number.outputs.meta_sha }}
      sha: ${{ steps.number.outputs.sha }}
    steps:
      # A re-run keeps the commit of its first attempt, so check out main's current tip instead.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: reazndev/otus-meta
          # Keep Mail main compatible while Mail #174 changes Meta's public packages.
          # Restore main once Mail main builds against those packages on Meta main.
          ref: b1a860f37f73bb46a12f15bbf9a93ddc8b6cdfa1
          path: otus-meta
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      - id: number
        env:
          GH_TOKEN: ${{ secrets.OTUS_NIGHTLY_TOKEN }}
        run: python3 tools/nightly_version.py

  build:
    needs: version
    if: needs.version.outputs.number != ''
    runs-on: ubicloud-standard-2
    env:
      NUMBER: ${{ needs.version.outputs.number }}
      PREVIOUS_MAIL: ${{ needs.version.outputs.previous_mail }}
      PREVIOUS_META: ${{ needs.version.outputs.previous_meta }}
      PREVIOUS_DATE: ${{ needs.version.outputs.previous_date }}
      MAIL_SHA: ${{ needs.version.outputs.sha }}
      META_SHA: ${{ needs.version.outputs.meta_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: reazndev/otus-meta
          ref: ${{ needs.version.outputs.meta_sha }}
          fetch-depth: 0
          path: otus-meta
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.OTUS_NIGHTLY_KEYSTORE }}
          OTUS_NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.OTUS_NIGHTLY_KEYSTORE_PASSWORD }}
        run: |
          export OTUS_NIGHTLY_KEYSTORE="$RUNNER_TEMP/nightly.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$OTUS_NIGHTLY_KEYSTORE"
          # The app shows the version name, the build's date as d.m.yy, such as 18.10.26.
          ./gradlew :androidApp:assembleNightly --console=plain \
            -Potus.meta.path=otus-meta -Potus.versionCode="$NUMBER" -Potus.versionName="$(date -u +%-d.%-m.%y)"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.OTUS_NIGHTLY_TOKEN }}
        run: |
          apk="otus-mail-nightly-$NUMBER.apk"
          cp androidApp/build/outputs/apk/nightly/androidApp-nightly.apk "$apk"
          jq -n --arg mail "$MAIL_SHA" --arg meta "$META_SHA" --argjson versionCode "$NUMBER" \
            '{mail: $mail, meta: $meta, versionCode: $versionCode}' > provenance.json
          # Without a recorded revision, such as after a release from before provenance, the notes
          # list the commits since the previous release was published, not old ones again.
          history() {
            local checkout="$1" previous="$2"
            if [ -n "$previous" ] && git -C "$checkout" merge-base --is-ancestor "$previous" HEAD; then
              git -C "$checkout" log "$previous..HEAD" --format='- %s'
            elif [ -n "$PREVIOUS_DATE" ]; then
              git -C "$checkout" log --since="$PREVIOUS_DATE" --format='- %s'
            else
              git -C "$checkout" log -n 20 --format='- %s'
            fi
          }
          history . "$PREVIOUS_MAIL" > notes.md
          history otus-meta "$PREVIOUS_META" >> notes.md
          gh release create "nightly-$NUMBER" "$apk" provenance.json -R "$NIGHTLY_REPO" \
            --title "Otus Mail nightly $(date -u +%-d.%-m.%y)" --notes-file notes.md
