name: nightly

# Builds a signed nightly APK of main and publishes it as a release of the public nightly
# repository, where the app's update check finds it. A night without new commits on main builds
# nothing. It builds against otus-meta main, like a local build, because Meta publishing is paused.
# See docs/nightly.md for the secrets this needs.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_otusMetaUsername: ${{ github.repository_owner }}
  ORG_GRADLE_PROJECT_otusMetaPassword: ${{ secrets.OTUS_META_PACKAGES_TOKEN }}
  # GitHubNightlyFeed reads releases from this repository.
  NIGHTLY_REPO: reazndev/otus-mail-nightly
  GH_TOKEN: ${{ secrets.OTUS_NIGHTLY_TOKEN }}

concurrency:
  group: nightly

jobs:
  version:
    runs-on: ubicloud-standard-2
    outputs:
      number: ${{ steps.number.outputs.number }}
      previous: ${{ steps.number.outputs.previous }}
      sha: ${{ steps.number.outputs.sha }}
    steps:
      # A re-run keeps the commit of its first attempt, so check out main's current tip instead.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      # Main is squash-merged, so its commit count grows by one per merge and orders the builds.
      - id: number
        run: |
          number=$(git rev-list --count HEAD)
          latest=$(gh release view -R "$NIGHTLY_REPO" --json tagName -q .tagName 2>/dev/null || true)
          echo "previous=${latest#nightly-}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$latest" != "nightly-$number" ]; then
            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$latest already covers main at $(git rev-parse --short HEAD), so there is nothing to build."
          fi

  build:
    needs: version
    if: needs.version.outputs.number != ''
    runs-on: ubicloud-standard-2
    env:
      NUMBER: ${{ needs.version.outputs.number }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: reazndev/otus-meta
          path: otus-meta
          ssh-key: ${{ secrets.OTUS_META_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.OTUS_NIGHTLY_KEYSTORE }}
          OTUS_NIGHTLY_KEYSTORE_PASSWORD: ${{ secrets.OTUS_NIGHTLY_KEYSTORE_PASSWORD }}
        run: |
          export OTUS_NIGHTLY_KEYSTORE="$RUNNER_TEMP/nightly.p12"
          echo "$KEYSTORE_BASE64" | base64 -d > "$OTUS_NIGHTLY_KEYSTORE"
          ./gradlew :androidApp:assembleNightly --console=plain \
            -Potus.meta.path=otus-meta -Potus.versionCode="$NUMBER" -Potus.versionName="nightly-$NUMBER"
      - name: Publish the release
        run: |
          apk="otus-mail-nightly-$NUMBER.apk"
          cp androidApp/build/outputs/apk/nightly/androidApp-nightly.apk "$apk"
          # The notes list each commit since the previous nightly, or the last 20 for the first one.
          count=$(( ${PREVIOUS:-0} > 0 ? NUMBER - PREVIOUS : 20 ))
          git log -n "$count" --format='- %s' > notes.md
          gh release create "nightly-$NUMBER" "$apk" -R "$NIGHTLY_REPO" \
            --title "Otus Mail nightly $NUMBER" --notes-file notes.md
