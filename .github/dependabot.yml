# Opens one grouped pull request a week per ecosystem. Titles follow the commit rules, such as
# "build(deps): bump the gradle group". Mark a pull request ready to run CI, as with any other.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
  # requirements-quality.txt includes push_bridge/requirements.txt, so the pip entry covers the
  # bridge's packages; this one covers its base image.
  - package-ecosystem: docker
    directory: /push_bridge
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
